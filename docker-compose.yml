services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092" # for client connections
      - "9101:9101" # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true

  events-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_event
      POSTGRES_USER: event
      POSTGRES_PASSWORD: event
    ports:
      - "6543:5432"

  users-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    ports:
      - "6544:5432"

  requests-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_requests
      POSTGRES_USER: requests
      POSTGRES_PASSWORD: requests
    ports:
      - "6545:5432"

  comments-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
    ports:
      - "6546:5432"

  analyzer-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats_analyzer
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
    ports:
      - "6547:5432"