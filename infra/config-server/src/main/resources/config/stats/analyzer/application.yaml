grpc:
  server:
    port: 0

server:
  port: 0

spring:
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show_sql: true

  datasource:
    url: jdbc:postgresql://localhost:6547/stats_analyzer
    username: analyzer
    password: analyzer
    driver-class-name: org.postgresql.Driver

logging:
  level:
    org:
      springframework:
        orm.jpa: INFO
        transaction: INFO
        transaction.interceptor: TRACE
        orm.jpa.JpaTransactionManager: DEBUG
    hibernate:
      SQL: DEBUG

analyzer:
  kafka:
    user-actions:
      bootstrap.servers: localhost:9092
      key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value.deserializer: ru.practicum.kafka.serializer.UserActionDeserializer
      group.id: "analyzer-action-group"
      enable.auto.commit: false
      auto.offset.reset: "earliest"

    events-similarity:
      bootstrap.servers: localhost:9092
      key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value.deserializer: ru.practicum.kafka.serializer.EventsSimilarityDeserializer
      group.id: "analyzer-similarity-group"
      enable.auto.commit: false
      auto.offset.reset: "earliest"

    topics:
      USER_ACTIONS: stats.user-actions.v1
      EVENTS_SIMILARITY: stats.events-similarity.v1